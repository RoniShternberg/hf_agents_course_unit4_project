[project]
name = "hf-agents-unit4-gaia"
version = "0.1.0"
description = "GAIA Level 1 agent for the Hugging Face Agents Course Unit 4 final project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.7",
    "langchain-experimental>=0.3.3",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "markdownify>=0.13.1",
    "pypdf>=5.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "tavily-python>=0.5.0",
    "youtube-transcript-api>=0.6.2",
    "gradio>=4.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
